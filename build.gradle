import java.security.SecureRandom

plugins {
    id 'com.android.application' version '8.10.0' apply false
}

static def generateHexString() {
    def secureRandom = new SecureRandom()
    return Long.toHexString(secureRandom.nextLong())
}

// The shell SO name is fixed to "xixin" so the packaged library reads as a
// brand-natural "libxixin.so" instead of gibberish. dpt.jar globs *.so under
// shell-files/libs/<abi>/, so nothing on the packing side depends on a random name.
// dptBuildKey is still random per build and persisted across Gradle invocations
// (dpt.jar ↔ shell-files pairing). Stored under the root build/ directory;
// clean deletes it so the next build regenerates.
def dptBuildIdsFile = file("${rootDir}/build/dpt-build-ids.properties")
def dptBuildIds = new Properties()
if (dptBuildIdsFile.exists()) {
    dptBuildIdsFile.withInputStream { dptBuildIds.load(it) }
}
def resolvedBuildKey = dptBuildIds.getProperty("dptBuildKey")
if (!resolvedBuildKey || resolvedBuildKey.isEmpty()) {
    resolvedBuildKey = generateHexString()
    dptBuildIds.setProperty("dptBuildKey", resolvedBuildKey)
    dptBuildIdsFile.parentFile.mkdirs()
    dptBuildIdsFile.withOutputStream { dptBuildIds.store(it, "dpt-shell build ids. Delete to regenerate.") }
}

ext {
    soName = "xixin"
    fullSoName = "lib${soName}.so"
    shellPackageName = generateHexString()
    dptBuildKey = resolvedBuildKey

    // Android SDK versions
    compileSdkVersion = 36
    minSdkVersion = 21
    targetSdkVersion = 36

    // App version
    appVersionCode = 1
    appVersionName = "1.1.5"

    // Java compatibility
    shellJavaVersion = JavaVersion.VERSION_1_8
    dptJavaVersion = JavaVersion.VERSION_11

    // CMake
    cmakeVersion = "3.31.1"

}

subprojects { sub ->
    sub.afterEvaluate {
        sub.tasks.matching { it.name == 'clean' }.configureEach { task ->
            task.doFirst {
                if (dptBuildIdsFile.exists()) {
                    dptBuildIdsFile.delete()
                    println("Deleted ${dptBuildIdsFile}")
                }
            }
        }
    }
}