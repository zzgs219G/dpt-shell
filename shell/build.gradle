import groovy.json.JsonOutput

import java.nio.file.Files
import java.nio.file.Paths

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luoye.dpt'
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.luoye.dpt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName

        multiDexEnabled false

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                abiFilters "armeabi-v7a","arm64-v8a","x86","x86_64"
                arguments("-DSO_NAME=${soName}", "-DDPT_BUILD_KEY=${dptBuildKey}",
                        "-DDPT_KL_SEED=${keyladderSeed}")
            }
        }

        buildConfigField "String", "SO_NAME", "\"${fullSoName}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Keep the native debug symbols out of the packaged SO but emit them
            // as shell/build/outputs/native-debug-symbols/release/native-debug-symbols.zip,
            // which release.yml ships next to the executable zip. The SO name is
            // regenerated on every build (see root build.gradle), so a crash log
            // from an older release can only be symbolized against that release's
            // own symbols -- they have to be published, not rebuilt.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version rootProject.ext.cmakeVersion
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.shellJavaVersion
        targetCompatibility rootProject.ext.shellJavaVersion
    }
    testOptions {
        // BackgroundDexopt 的单测会触到 android.util.Log（JVM 里默认抛 not mocked），
        // 这里允许返回默认值，让纯逻辑（marker/命令拼装/兜底路径）可在 JVM 单测。
        unitTests.returnDefaultValues = true
    }
}

def afterAssembleCopy(Project project, Map archMap, boolean debug) {
    def buildTypeName = null
    def dexSourceDirName = null
    def soFileTypeName = null
    def sourceSoLibsDir = null
    if(debug) {
        buildTypeName = "debug"
        dexSourceDirName = "mergeDexDebug"
        soFileTypeName = "merged_native_libs"
        sourceSoLibsDir = file(project.buildDir.absolutePath + File.separator
                + "intermediates" + File.separator
                + soFileTypeName + File.separator
                + buildTypeName + File.separator
                + "mergeDebugNativeLibs" + File.separator
                + "out" + File.separator
                + "lib" + File.separator
        )

    }
    else {
        buildTypeName = "release"
        dexSourceDirName = "minifyReleaseWithR8"
        soFileTypeName = "stripped_native_libs"
        sourceSoLibsDir = file(project.buildDir.absolutePath + File.separator
                + "intermediates" + File.separator
                + soFileTypeName + File.separator
                + buildTypeName + File.separator
                + "stripReleaseDebugSymbols" + File.separator
                + "out" + File.separator
                + "lib" + File.separator
        )
    }

    def targetDir = file(project.rootDir.absolutePath + File.separator + "executable" + File.separator + "shell-files")
    def targetSoLibsDir = file(targetDir.absolutePath + File.separator + "libs")

    println("[" + project.name + "] " + sourceSoLibsDir.absolutePath + " -> " + targetSoLibsDir.absolutePath)

    def status = delete(fileTree(targetDir.absolutePath) {
        include 'dex/classes.dex', "libs/**/*.so"
    })

    println("afterAssembleCopy shell-files delete status: " + status)

    copy {
        from project.buildDir.absolutePath + File.separator + "intermediates" + File.separator + "dex" + File.separator + buildTypeName + File.separator + dexSourceDirName + File.separator + "classes.dex"
        into targetDir.absolutePath + File.separator + "dex"
    }

    for(e in archMap) {
        copy {
            include "**/${fullSoName}"
            from file(sourceSoLibsDir.absolutePath + File.separator
                    + e.key)
            into file(targetSoLibsDir.absolutePath + File.separator
                    + e.value)
        }
    }

    // ── 移除 .comment 段（2026-10-27，逆向实测后补）──────────────────
    // 产物里 .comment 明文写着完整工具链指纹，例如：
    //   Android (12027248, +pgo, +bolt, +lto, +mlgo, based on r522817)
    //   clang version 18.0.1 (...)
    //   Linker: LLD 18.0.1
    // 逆向者可据此精确对应已知优化行为与工具链缺陷。
    // `--strip-all` 只删 .symtab/.strtab，删不掉 .comment，必须显式移除。
    // 与 apk-protect-action 的 libnc.so 处理保持一致。
    // 失败只告警不阻塞：拿不到 objcopy 只是少一层收益，不该让构建变红。
    def objcopy = null
    def ndkDir = android.ndkDirectory
    if (ndkDir != null) {
        def hostTag = System.getProperty("os.name").toLowerCase().contains("mac") ? "darwin-x86_64" : "linux-x86_64"
        def cand = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/bin/llvm-objcopy")
        if (cand.isFile()) objcopy = cand.absolutePath
    }
    if (objcopy == null) {
        def p = ["bash", "-lc", "command -v llvm-objcopy || command -v objcopy || true"].execute()
        p.waitFor()
        def out = p.in.text.trim()
        if (!out.isEmpty()) objcopy = out.readLines().first().trim()
    }
    for(e in archMap) {
        def soFile = new File(targetSoLibsDir, e.value + File.separator + fullSoName)
        if (!soFile.isFile()) continue
        if (objcopy == null) {
            logger.warn("[shell] 未找到 llvm-objcopy，.comment 段保留（工具链指纹泄露）")
            continue
        }
        def proc = [objcopy, "--remove-section=.comment", soFile.absolutePath].execute()
        proc.waitFor()
        if (proc.exitValue() != 0) {
            logger.warn("[shell] .comment 移除失败（${soFile.name}）: ${proc.err.text.trim()}")
        } else {
            println("[shell] .comment 已移除: ${soFile.name}")
        }
    }

    // Keep encrypt/decrypt key next to the SO artifacts that dpt packages.
    def buildKeyFile = new File(targetDir, "build-key")
    buildKeyFile.text = "${dptBuildKey}\n"
    println("[" + project.name + "] wrote build key -> " + buildKeyFile.absolutePath)

    // keyladder seed must sit next to build-key: dpt.jar's encryptSoFiles()
    // reads it, and the C side was compiled with the same -DDPT_KL_SEED.
    // One Gradle build = one seed across all four ABIs.
    if (keyladderSeed == null || !(keyladderSeed ==~ /^[0-9a-f]{16}$/)) {
        throw new GradleException("keyladderSeed 必须是 16 位小写 hex，当前: " + keyladderSeed)
    }
    def keyladderSeedFile = new File(targetDir, "keyladder-seed.txt")
    keyladderSeedFile.text = "${keyladderSeed}\n"
    println("[" + project.name + "] wrote keyladder seed -> " + keyladderSeedFile.absolutePath)

    // Re-persist ids after assemble so a mid-build clean cannot leave them missing.
    def idsFile = new File(project.rootDir, "build" + File.separator + "dpt-build-ids.properties")
    idsFile.parentFile.mkdirs()
    idsFile.text = "# dpt-shell build ids\nsoName=${soName}\ndptBuildKey=${dptBuildKey}\nkeyladderSeed=${keyladderSeed}\n"
}

def afterNativeBuildCopy(Project project, Map archMap, boolean debug) {
    def buildTypeName = "release"
    def subBuildTypeName = "mergeReleaseNativeLibs"
    if(debug) {
        buildTypeName = "debug"
        subBuildTypeName = "mergeDebugNativeLibs"
    }
    def sourceDir = file(project.buildDir.absolutePath + File.separator
            + "intermediates" + File.separator
            + "merged_native_libs" + File.separator
            + buildTypeName + File.separator
            + subBuildTypeName + File.separator
            + "out" + File.separator
            + "lib" + File.separator
    )

    def targetDir = file(project.projectDir.absolutePath + File.separator
            + "src" + File.separator
            + "main" + File.separator
            + "assets" + File.separator
            + "xixin")

    println("[" + project.name + "] " + sourceDir.absolutePath + " -> " + targetDir.absolutePath)

    def status = delete(fileTree(targetDir.absolutePath) {
        include "/**/*.so"
    })

    println("afterNativeBuildCopy demo libs delete status: " + status)

    for(e in archMap) {
        copy {
            include "**/${fullSoName}"
            from file(sourceDir.getAbsolutePath() + File.separator
                    + e.key)
            into file(targetDir.getAbsolutePath() + File.separator
                    + e.value)
        }
    }
}


afterEvaluate { Project project ->
    if (project.name != "shell") {
        printf("project %s skip\n", project.name)
        return
    }

    def assembleTask = project.tasks.getByName("assemble")
    def assembleDebugTask = project.tasks.getByName("assembleDebug")
    def assembleReleaseTask = project.tasks.getByName("assembleRelease")
    def nativeDebugBuildTask = project.tasks.getByName("mergeDebugNativeLibs")
    def nativeReleaseBuildTask = project.tasks.getByName("mergeReleaseNativeLibs")

    def archMap = [
            "armeabi-v7a":"arm",
            "arm64-v8a":"arm64",
            "x86":"x86",
            "x86_64":"x86_64"
    ]

    def list = project.gradle.startParameter.taskNames
    if(list == null || list.size() == 0) {
        return
    }

    def firstTaskName = list.get(0)

    println("first task: " + firstTaskName)

    def buildTask = assembleTask
    def nativeBuildTask = nativeReleaseBuildTask
    def debug = false
    if(firstTaskName == "shell:assemble" || firstTaskName == "assemble") {
        buildTask = assembleTask
        nativeBuildTask = nativeReleaseBuildTask
        debug = false
    }
    else if(firstTaskName == "shell:assembleRelease" || firstTaskName == "assembleRelease") {
        buildTask = assembleReleaseTask
        nativeBuildTask = nativeReleaseBuildTask
        debug = false
    }
    else if(firstTaskName == "shell:assembleDebug" || firstTaskName == "assembleDebug") {
        buildTask = assembleDebugTask
        nativeBuildTask = nativeDebugBuildTask
        debug = true
    }

    buildTask.doLast {
        afterAssembleCopy(project, archMap, debug)
    }

    nativeBuildTask.doLast {
        afterNativeBuildCopy(project, archMap, debug)
    }

}

dependencies {

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'androidx.annotation:annotation:1.0.0'
}